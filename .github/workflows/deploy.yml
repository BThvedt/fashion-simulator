name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - 'backend-fs/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # A cold Docker build (compiling PHP extensions from source, no
          # cached layers) has been observed taking well over 20m on the
          # droplet and getting killed mid-build at that timeout, before
          # composer install/drush deploy even ran. Giving this one real
          # headroom to finish end-to-end; once the image layers are cached,
          # later deploys that don't touch the Dockerfile should be much
          # faster and this can be ratcheted back down.
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/fashion-simulator
            # DNS on the droplet can hiccup transiently ("Temporary failure
            # in name resolution"); retry a few times before giving up. Fail
            # hard if every attempt errors, so we never deploy stale code.
            pull_ok=0
            for i in 1 2 3; do
              if git pull origin main; then pull_ok=1; break; fi
              echo "git pull failed (attempt $i), retrying..."
              sleep 5
            done
            if [ "$pull_ok" -ne 1 ]; then
              echo "git pull failed after 3 attempts, aborting deploy." >&2
              exit 1
            fi
            cd backend-fs
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T php composer install --no-dev --optimize-autoloader
            # Run drush as www-data so cache/asset dirs under sites/default/files
            # are created owned by the PHP-FPM runtime user (not root).
            docker compose -f docker-compose.prod.yml exec -T -u www-data php vendor/bin/drush deploy