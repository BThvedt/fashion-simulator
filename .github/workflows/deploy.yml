name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - 'backend-fs/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/fashion-simulator
            git pull origin main
            cd backend-fs
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T php composer install --no-dev --optimize-autoloader
            # Run drush as www-data so cache/asset dirs under sites/default/files
            # are created owned by the PHP-FPM runtime user (not root).
            docker compose -f docker-compose.prod.yml exec -T -u www-data php vendor/bin/drush deploy