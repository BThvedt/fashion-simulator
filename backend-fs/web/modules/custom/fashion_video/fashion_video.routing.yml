fashion_video.pose_images:
  path: '/fashion-video/{uuid}/pose-images'
  defaults:
    _controller: 'Drupal\fashion_video\Controller\FashionVideoUploadController::poseImages'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
    uuid: '[0-9a-fA-F-]+'
  options:
    _auth: ['oauth2', 'cookie']
    no_cache: 'TRUE'

fashion_video.settings_form:
  path: '/admin/config/media/fashion-video'
  defaults:
    _form: 'Drupal\fashion_video\Form\SettingsForm'
    _title: 'Fashion Video'
  requirements:
    _permission: 'administer site configuration'

