# Public, unauthenticated read of a *shared* video by its hard-to-guess token.
# Returns 404 unless a fashion_video node with that token has sharing enabled.
fashion_video.shared_media:
  path: '/fashion-video/shared/{token}/media'
  defaults:
    _controller: 'Drupal\fashion_video\Controller\FashionVideoUploadController::sharedMedia'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    token: '[0-9a-fA-F]+'
  options:
    no_cache: 'TRUE'
