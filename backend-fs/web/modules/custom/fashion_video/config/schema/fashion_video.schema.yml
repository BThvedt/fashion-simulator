fashion_video.settings:
  type: config_object
  label: 'Fashion Video settings'
  mapping:
    max_encodes:
      type: integer
      label: 'Maximum concurrent video encodes'
    max_concurrent_videos:
      type: integer
      label: 'Maximum videos generating at once (queue size)'
    talking_head_provider:
      type: string
      label: 'Talking-head (lip sync) provider'
    heygen_engine:
      type: string
      label: 'HeyGen rendering engine'
    include_ken_burns:
      type: boolean
      label: 'Include Ken Burns still montage in the final video'
