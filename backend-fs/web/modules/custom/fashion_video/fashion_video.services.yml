services:
  fashion_video.uploader:
    class: Drupal\fashion_video\FashionVideoUploader
    arguments:
      - '@entity_type.manager'
      - '@file.repository'
      - '@file_system'
      - '@config.factory'
      - '@?s3fs'
      - '@file_url_generator'
  logger.channel.fashion_video:
    parent: logger.channel_base
    arguments: ['fashion_video']
  fashion_video.stylist:
    class: Drupal\fashion_video\AestheticGenerator
    arguments:
      - '@http_client'
      - '@logger.channel.fashion_video'
  fashion_video.image_generator:
    class: Drupal\fashion_video\ImageGenerator
    arguments:
      - '@http_client'
      - '@logger.channel.fashion_video'
  fashion_video.talking_head.did:
    class: Drupal\fashion_video\TalkingHeadGenerator
    arguments:
      - '@http_client'
      - '@logger.channel.fashion_video'
  fashion_video.talking_head.heygen:
    class: Drupal\fashion_video\HeyGenTalkingHeadGenerator
    arguments:
      - '@http_client'
      - '@logger.channel.fashion_video'
      - '@config.factory'
  fashion_video.talking_head:
    class: Drupal\fashion_video\TalkingHeadManager
    arguments:
      - '@fashion_video.talking_head.heygen'
      - '@fashion_video.talking_head.did'
      - '@config.factory'
  fashion_video.motion_clip:
    class: Drupal\fashion_video\MotionClipGenerator
    arguments:
      - '@http_client'
      - '@logger.channel.fashion_video'
  fashion_video.assembler:
    class: Drupal\fashion_video\VideoAssembler
    arguments:
      - '@file_system'
      - '@logger.channel.fashion_video'
